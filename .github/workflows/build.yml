name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: runpod-workers/worker-comfyui
          ref: "5.8.6"
          path: worker-comfyui

      - name: Patch Dockerfile — add build-essential + python3.12-dev (Triton needs a C compiler + Python.h at runtime)
        run: |
          sed -i 's/apt-get install -y \\/apt-get install -y \\\n    build-essential \\\n    python3.12-dev \\/' worker-comfyui/Dockerfile
          grep -A4 "apt-get install -y" worker-comfyui/Dockerfile | head -6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./worker-comfyui
          build-args: |
            COMFYUI_VERSION=0.31.1
            MODEL_TYPE=none
            CUDA_VERSION_FOR_COMFY=12.6
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/takeone-runpod-worker:latest

      - name: Make package public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/takeone-runpod-worker/visibility" \
            -d '{"visibility":"public"}' || true
